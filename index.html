<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GYM TRACKER</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- ЭКРАН РЕГИСТРАЦИИ -->
        <div id="registerScreen" class="screen">
            <div class="register-card">
                <h2>🏋️ GYM TRACKER</h2>
                <div class="input-group">
                    <label>ИМЯ</label>
                    <input type="text" id="regName" placeholder="Ваше имя">
                </div>
                <div class="input-group">
                    <label>РОСТ (см)</label>
                    <input type="number" id="regHeight" placeholder="170" value="170">
                </div>
                <div class="input-group">
                    <label>ВЕС (кг)</label>
                    <input type="number" step="0.1" id="regWeight" placeholder="70" value="70">
                </div>
                <div class="input-group">
                    <label>ДАТА РОЖДЕНИЯ</label>
                    <input type="date" id="regBirthdate">
                </div>
                <div class="input-group">
                    <label>ПОЛ</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male"> Мужской</label>
                        <label><input type="radio" name="gender" value="female"> Женский</label>
                    </div>
                </div>
                <div class="input-group">
                    <label>ДНЕЙ ПОСЕЩЕНИЙ</label>
                    <input type="number" id="regDays" placeholder="0" value="0">
                </div>
                <button id="saveProfileBtn" class="btn-primary">СОХРАНИТЬ И НАЧАТЬ</button>
            </div>
        </div>

        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div id="mainApp" class="screen hidden">
            <div class="header">
                <h1 class="logo">🏋️ GYM TRACKER</h1>
                <div id="checkStatus" class="check-status"></div>
            </div>

            <div class="profile-card">
                <div id="userName" class="profile-name"></div>
                <div id="userStats" class="profile-stats"></div>
                <div class="metrics-grid">
                    <div class="metric">
                        <div class="metric-label">ИМТ</div>
                        <div id="bmiValue" class="metric-value"></div>
                        <div id="bmiStatus" class="metric-status"></div>
                    </div>
                    <div class="metric" onclick="window.User?.showWeightModal()">
                        <div class="metric-label">ВЕС</div>
                        <div id="weightValue" class="metric-value"></div>
                        <div class="metric-unit">кг</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">ДНИ</div>
                        <div id="daysValue" class="metric-value"></div>
                        <div class="metric-unit">в зале</div>
                    </div>
                </div>
            </div>

            <div id="goalCard"></div>

            <button id="checkInBtn" class="btn-primary">✅ ОТМЕТИТЬСЯ СЕГОДНЯ</button>

            <div class="nav-tabs">
                <button class="nav-tab active" data-page="main">🏠 Главная</button>
                <button class="nav-tab" data-page="calendar">📅 Календарь</button>
                <button class="nav-tab" data-page="exercises">💪 Упражнения</button>
                <button class="nav-tab" data-page="history">📊 История</button>
            </div>

            <div id="pageMain" class="page">
                <div class="exercises-section">
                    <h3>🏋️ УПРАЖНЕНИЯ</h3>
                    <div id="exercisesList"></div>
                    <button id="addExerciseBtn" class="btn-add">+ ДОБАВИТЬ УПРАЖНЕНИЕ</button>
                </div>
            </div>

           <div id="pageCalendar" class="page hidden">
    <div class="calendar-header">
        <button id="calendarPrev" class="btn-nav">◀</button>
        <span id="calendarMonthLabel" class="calendar-month-label"></span>
        <button id="calendarNext" class="btn-nav">▶</button>
    </div>
    <div id="calendarGrid" class="calendar-grid"></div>
    <div class="weight-chart">
        <canvas id="weightChart"></canvas>
        <div id="weightStats" class="weight-stats"></div>
    </div>
</div>

            <div id="pageExercises" class="page hidden">
                <div class="exercises-section">
                    <h3>💪 ВСЕ УПРАЖНЕНИЯ</h3>
                    <div id="fullExercisesList"></div>
                    <button id="addExerciseBtn2" class="btn-add">+ ДОБАВИТЬ УПРАЖНЕНИЕ</button>
                </div>
            </div>

            <div id="pageHistory" class="page hidden">
                <div id="historyList" class="history-list"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНЫЕ ОКНА -->
    <div id="addSetModal" class="modal">
        <div class="modal-content">
            <h3 id="modalExerciseName">Добавить подход</h3>
            <div class="input-group">
                <label>Вес (кг)</label>
                <input type="number" step="0.5" id="setWeight" placeholder="Например: 80">
            </div>
            <div class="input-group">
                <label>Повторения</label>
                <input type="number" id="setReps" placeholder="Например: 5">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="window.closeModal?.('addSetModal')">ОТМЕНА</button>
                <button class="btn-save" onclick="window.Exercises?.saveSet()">СОХРАНИТЬ</button>
            </div>
        </div>
    </div>

    <div id="addExerciseModal" class="modal">
        <div class="modal-content">
            <h3>➕ Новое упражнение</h3>
            <div class="input-group">
                <label>Название упражнения</label>
                <input type="text" id="newExerciseName" placeholder="Например: Подтягивания">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="window.closeModal?.('addExerciseModal')">ОТМЕНА</button>
                <button class="btn-save" onclick="window.Exercises?.create()">СОЗДАТЬ</button>
            </div>
        </div>
    </div>

    <div id="oneRMModal" class="modal">
        <div class="modal-content">
            <h3>📐 Калькулятор 1RM</h3>
            <div class="input-group">
                <label>Вес (кг)</label>
                <input type="number" step="0.5" id="calcWeight" placeholder="Введите вес">
            </div>
            <div class="input-group">
                <label>Повторения</label>
                <input type="number" id="calcReps" placeholder="Введите количество">
            </div>
            <div id="calcResult" class="calc-result"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="window.closeModal?.('oneRMModal')">ЗАКРЫТЬ</button>
                <button class="btn-save" onclick="window.Exercises?.saveFromCalculator()">СОХРАНИТЬ</button>
            </div>
        </div>
    </div>

    <div id="weightModal" class="modal">
        <div class="modal-content">
            <h3>⚖️ Изменить вес</h3>
            <div class="input-group">
                <label>Новый вес (кг)</label>
                <input type="number" step="0.1" id="newWeight" placeholder="Введите вес">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="window.closeModal?.('weightModal')">ОТМЕНА</button>
                <button class="btn-save" onclick="window.User?.updateWeight()">СОХРАНИТЬ</button>
            </div>
        </div>
    </div>

    <div id="goalModal" class="modal">
        <div class="modal-content">
            <h3>🎯 Установить цель</h3>
            <div class="input-group">
                <label>Тип цели</label>
                <select id="goalType">
                    <option value="lose">⬇️ Сбросить вес</option>
                    <option value="gain">⬆️ Набрать вес</option>
                </select>
            </div>
            <div class="input-group">
                <label>Целевой вес (кг)</label>
                <input type="number" step="0.1" id="goalTargetWeight" placeholder="Например: 70">
            </div>
            <div class="input-group">
                <label>Дата достижения</label>
                <input type="date" id="goalTargetDate">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="window.closeModal('goalModal')">ОТМЕНА</button>
                <button class="btn-save" onclick="window.Goals.saveGoal()">СОХРАНИТЬ</button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-content">
            <h3 id="historyExerciseName">Упражнение</h3>
            <div class="history-header-stats">
                <div><span class="label">🔥 Лучший 1ПМ:</span> <strong id="historyExercisePr" class="value">0</strong> <span class="unit">кг</span></div>
                <div><span class="label">📊 Всего:</span> <strong id="historyTotalSets">0</strong> <span class="unit">подходов</span></div>
            </div>
            <div id="historySetsList" class="history-sets-list"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="window.closeModal('historyModal')">ЗАКРЫТЬ</button>
                <button class="btn-save" onclick="window.Exercises.showAddSet(window.Exercises.currentExerciseForEdit?.id, window.Exercises.currentExerciseForEdit?.name); window.closeModal('historyModal')">➕ ДОБАВИТЬ ПОДХОД</button>
            </div>
        </div>
    </div>

    <div id="editSetModal" class="modal">
        <div class="modal-content">
            <h3>✏️ Редактировать подход</h3>
            <div class="info-block">
                <div>🆔 ID: <strong id="editSetId"></strong></div>
                <div>📅 Дата: <strong id="editSetDate"></strong></div>
            </div>
            <div class="input-group">
                <label>Вес (кг)</label>
                <input type="number" step="0.5" id="editSetWeight">
            </div>
            <div class="input-group">
                <label>Повторения</label>
                <input type="number" id="editSetReps">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="window.closeModal('editSetModal')">ОТМЕНА</button>
                <button class="btn-save" onclick="window.Exercises.saveEditSet()">СОХРАНИТЬ</button>
            </div>
        </div>
    </div>

    <script src="modules/storage.js"></script>
    <script src="modules/user.js"></script>
    <script src="modules/exercises.js"></script>
    <script src="modules/calendar.js"></script>
    <script src="modules/history.js"></script>
    <script src="modules/goals.js"></script>
    <script src="app.js"></script>
</body>
</html>
